# Локальне середовище розробки.
#   docker compose up -d                 — БД, пошта, сховище файлів (API запускаємо з Rider)
#   docker compose --profile full up -d  — те саме + API в контейнері (http://localhost:8080)
name: socialnetwork

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: socialnetwork
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d socialnetwork"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Локальний "поштовий ящик": усі листи ловляться тут, веб-інтерфейс — http://localhost:5080
  smtp4dev:
    image: rnwood/smtp4dev:v3
    ports:
      - "5080:80"
      - "2525:25"

  # Локальне S3-сумісне сховище файлів (аватари, фото, відео) — замінник Supabase Storage.
  # S3 API — http://localhost:9000, веб-консоль — http://localhost:9001
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-devaccess}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-devsecret123}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data

  # Одноразово створює bucket "media" і дозволяє читати файли без авторизації (як public bucket у Supabase).
  storage-init:
    image: amazon/aws-cli:latest
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-devaccess}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-devsecret123}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        S3="aws --endpoint-url http://rustfs:9000 s3api"
        until $$S3 list-buckets > /dev/null 2>&1; do echo "Чекаю RustFS..."; sleep 1; done
        $$S3 head-bucket --bucket media 2>/dev/null || $$S3 create-bucket --bucket media
        $$S3 put-bucket-policy --bucket media --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::media/*"]}]}'
        echo "Bucket media готовий"
    restart: "no"

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: src/SocialNetwork.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=socialnetwork;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      # Береться з .env (див. .env.example); без нього API не стартує з зрозумілою помилкою.
      Jwt__Key: ${JWT_KEY:-}
      Smtp__Host: smtp4dev
      Smtp__Port: 25
      # API звертається до сховища всередині Docker-мережі, а браузер відкриває файли через localhost.
      Storage__ServiceUrl: http://rustfs:9000
      Storage__AccessKey: ${S3_ACCESS_KEY:-devaccess}
      Storage__SecretKey: ${S3_SECRET_KEY:-devsecret123}
      Storage__PublicBaseUrl: http://localhost:9000/media
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  rustfs-data:
