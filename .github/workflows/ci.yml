# Перевірка кожного Pull Request: збірка + всі тести (інтеграційні тести самі піднімають PostgreSQL у Docker).
name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SocialNetwork.slnx

      - name: Build
        run: dotnet build SocialNetwork.slnx --no-restore -c Release

      - name: Test
        run: dotnet test SocialNetwork.slnx --no-build -c Release --logger "console;verbosity=normal"
